name: Auto Backup to Google Drive

on:
  push:
    branches:
      - master

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Zip Code
        run: |
          # Use Day of Week (Monday, Tuesday...) to rotate backups automatically
          DAY_OF_WEEK=$(date +'%A')
          ZIP_FILENAME="AIRCLEAN_WMS_Backup_${DAY_OF_WEEK}.zip"
          
          # Compress everything EXCEPT the release4 folder and .git folder
          zip -r $ZIP_FILENAME . -x "release4/*" -x ".git/*"
          
          # Save filename to output for next steps
          echo "ZIP_FILENAME=${ZIP_FILENAME}" >> $GITHUB_ENV

      - name: Upload to Google Drive
        uses: willo32/google-drive-upload-action@v1
        with:
          target: ${{ secrets.GDRIVE_FOLDER_ID }}
          credentials: ${{ secrets.GDRIVE_CREDENTIALS_JSON }}
          filename: ${{ env.ZIP_FILENAME }}
          overwrite: "true"
