<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>DBY - Ảnh đóng gói sẵn</title>
  <style>
    :root{--green:#087a50;--mint:#e8f7ef;--ink:#15372c;--muted:#657b73;--line:#cfe3d9;--red:#b42318}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:22px 15px calc(28px + env(safe-area-inset-bottom));font:16px/1.45 ui-rounded,system-ui,sans-serif;color:var(--ink);background:radial-gradient(circle at top right,#d8f1e4,transparent 42%),#f5faf7}main{width:min(100%,520px);margin:auto}.badge{display:inline-flex;padding:6px 10px;border-radius:999px;color:var(--green);background:var(--mint);font-size:13px;font-weight:800}h1{margin:14px 0 4px;font-size:26px}p{color:var(--muted)}.card{margin-top:18px;padding:18px;border:1px solid var(--line);border-radius:20px;background:#fff;box-shadow:0 12px 40px rgba(7,84,57,.09)}.target{display:grid;grid-template-columns:1fr auto;gap:10px;padding-bottom:15px;border-bottom:1px solid #e6eee9}.target strong{display:block;font-size:19px}.qty{color:var(--green);font-size:20px;font-weight:850}.camera-box{display:none;overflow:hidden;margin-top:16px;border:1px solid var(--line);border-radius:15px;background:#10251d}.camera-box.show{display:block}.camera-box video{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}.capture,.submit{width:100%;min-height:50px;border:0;border-radius:12px;font:inherit;font-weight:800}.capture{margin-top:16px;color:var(--green);border:1px solid #9bcab5;background:#fff}.capture.secondary{margin-top:10px;color:var(--muted);border-color:var(--line)}.submit{margin-top:12px;color:#fff;background:var(--green)}button:disabled{opacity:.45}.preview{display:none;overflow:hidden;margin-top:12px;border:1px solid var(--line);border-radius:15px;background:#edf5f1}.preview.show{display:block}.preview img{display:block;width:100%;max-height:420px;object-fit:cover}.preview span{display:block;padding:9px 11px;color:var(--muted);font-size:12px}.status{display:none;margin-top:12px;padding:12px;border-radius:12px;font-weight:700;text-align:center}.status.show{display:block}.status.loading{color:#7a4a00;background:#fff1d6}.status.success{color:#086c49;background:#dff7eb}.status.error{color:var(--red);background:#ffebe9}.hint{margin-bottom:0;font-size:12px}canvas{display:none}
  </style>
</head>
<body><main><div class="badge">DBY · CHỤP QUA ĐIỆN THOẠI</div><h1>Ảnh đóng gói sẵn hôm nay</h1><p>Chụp thực tế số hàng đã bù đủ chỉ tiêu rồi gửi lên hệ thống.</p><div class="card"><div class="target"><div><strong id="product">Đang tải...</strong><span id="employee"></span></div><div id="qty" class="qty"></div></div><div id="cameraBox" class="camera-box"><video id="video" autoplay playsinline muted></video></div><button id="startCamera" class="capture" type="button">Bật camera chụp ảnh</button><button id="takePhoto" class="capture secondary" type="button" disabled>Chụp ảnh</button><canvas id="canvas"></canvas><div id="preview" class="preview"><img id="image" alt="Ảnh đóng gói"><span id="name"></span></div><button id="submit" class="submit" type="button" disabled>Gửi ảnh hôm nay</button><div id="status" class="status"></div><p class="hint">Chỉ nhận ảnh chụp trực tiếp từ camera. Ảnh mới sẽ thay ảnh đang hiển thị trên máy tính; lịch sử cũ vẫn được lưu để tra soát.</p></div></main>
<script>
const session=new URLSearchParams(location.search).get('session')||'';
const cameraBox=document.querySelector('#cameraBox'),video=document.querySelector('#video'),canvas=document.querySelector('#canvas'),startCamera=document.querySelector('#startCamera'),takePhoto=document.querySelector('#takePhoto'),submit=document.querySelector('#submit'),preview=document.querySelector('#preview'),image=document.querySelector('#image'),nameBox=document.querySelector('#name'),statusBox=document.querySelector('#status');
let stream=null,photoBlob=null,previewUrl='';
function status(kind,text){statusBox.className=`status show ${kind}`;statusBox.textContent=text}
function stopCamera(){if(stream){stream.getTracks().forEach(track=>track.stop());stream=null}video.srcObject=null;takePhoto.disabled=true}
async function startCameraStream(){
  if(!navigator.mediaDevices?.getUserMedia) throw new Error('Trình duyệt không hỗ trợ camera trực tiếp hoặc phiên QR chưa dùng kết nối bảo mật.');
  stopCamera();
  stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1440}},audio:false});
  video.srcObject=stream;cameraBox.classList.add('show');takePhoto.disabled=false;startCamera.textContent='Bật lại camera';statusBox.className='status';
}
function captureFrame(){
  if(!stream||!video.videoWidth) throw new Error('Camera chưa sẵn sàng. Hãy thử lại.');
  const scale=Math.min(1,1920/video.videoWidth);canvas.width=Math.max(1,Math.round(video.videoWidth*scale));canvas.height=Math.max(1,Math.round(video.videoHeight*scale));
  const context=canvas.getContext('2d');context.drawImage(video,0,0,canvas.width,canvas.height);
  return new Promise((resolve,reject)=>canvas.toBlob(blob=>blob?resolve(blob):reject(new Error('Không thể tạo ảnh từ camera.')),'image/jpeg',.84));
}
async function compressImage(source){
  const bitmap=await createImageBitmap(source);let width=Math.min(bitmap.width,1920),height=Math.max(1,Math.round(bitmap.height*(width/bitmap.width)));const target=document.createElement('canvas'),context=target.getContext('2d');
  for(let attempt=0;width>=320&&height>=240;attempt+=1){target.width=width;target.height=height;context.drawImage(bitmap,0,0,width,height);for(const quality of [.84,.74,.64,.54,.44,.34,.25]){const blob=await new Promise(resolve=>target.toBlob(resolve,'image/jpeg',quality));if(blob&&blob.size<=480*1024){bitmap.close();return blob}}width=Math.round(width*.75);height=Math.round(height*.75)}bitmap.close();throw new Error('Không thể nén ảnh xuống dưới 500 KB. Hãy chụp lại ảnh rõ hơn.')
}
async function sha256(blob){const bytes=await blob.arrayBuffer();const digest=await crypto.subtle.digest('SHA-256',bytes);return Array.from(new Uint8Array(digest),byte=>byte.toString(16).padStart(2,'0')).join('')}
startCamera.onclick=async()=>{try{status('loading','Đang mở camera...');await startCameraStream();statusBox.className='status'}catch(error){status('error',error?.message||'Không thể mở camera.')}};
takePhoto.onclick=async()=>{try{takePhoto.disabled=true;photoBlob=await compressImage(await captureFrame());if(previewUrl)URL.revokeObjectURL(previewUrl);previewUrl=URL.createObjectURL(photoBlob);image.src=previewUrl;nameBox.textContent='Ảnh chụp trực tiếp từ camera';preview.classList.add('show');submit.disabled=false;statusBox.className='status'}catch(error){status('error',error?.message||'Không thể chụp ảnh.')}finally{takePhoto.disabled=!stream}};
submit.onclick=async()=>{if(!photoBlob)return;submit.disabled=true;startCamera.disabled=true;takePhoto.disabled=true;status('loading','Đang tạo mã SHA-256 và lưu ảnh...');try{const hash=await sha256(photoBlob);const response=await fetch(`/prepack-evidence/submit?session=${encodeURIComponent(session)}`,{method:'POST',headers:{'content-type':'image/jpeg','x-camera-capture':'getusermedia','x-content-sha256':hash,'x-file-name':'anh-dong-goi-hom-nay.jpg'},body:photoBlob});const result=await response.json().catch(()=>({}));if(!response.ok||!result.success)throw new Error(result.error||'Không thể gửi ảnh.');status('success','Đã cập nhật ảnh hôm nay. Bạn có thể đóng trang này.');submit.textContent='Đã gửi thành công';stopCamera()}catch(error){status('error',error?.message||'Không thể gửi ảnh.');startCamera.disabled=false;takePhoto.disabled=!stream;submit.disabled=false}};
fetch(`/prepack-evidence/session?session=${encodeURIComponent(session)}`).then(async response=>{const result=await response.json().catch(()=>({}));if(!response.ok||!result.success)throw new Error(result.error||'Phiên QR không hợp lệ.');document.querySelector('#product').textContent=result.target.productName;document.querySelector('#employee').textContent=`${result.target.productSku} · ${result.target.employee}`;document.querySelector('#qty').textContent=`${result.target.requestedQty} ${result.target.unit}`}).catch(error=>{status('error',error?.message||'Không thể mở phiên QR.');startCamera.disabled=true});
addEventListener('pagehide',()=>{stopCamera();if(previewUrl)URL.revokeObjectURL(previewUrl)});
</script></body></html>
