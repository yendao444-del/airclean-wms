<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>DBY - Ảnh đóng gói sẵn</title>
  <style>
    :root{--green:#087a50;--mint:#e8f7ef;--ink:#15372c;--muted:#657b73;--line:#cfe3d9;--red:#b42318}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:22px 15px calc(28px + env(safe-area-inset-bottom));font:16px/1.45 ui-rounded,system-ui,sans-serif;color:var(--ink);background:radial-gradient(circle at top right,#d8f1e4,transparent 42%),#f5faf7}main{width:min(100%,560px);margin:auto}.badge{display:inline-flex;padding:6px 10px;border-radius:999px;color:var(--green);background:var(--mint);font-size:13px;font-weight:800}h1{margin:14px 0 4px;font-size:26px}p{color:var(--muted)}.card{margin-top:18px;padding:18px;border:1px solid var(--line);border-radius:20px;background:#fff;box-shadow:0 12px 40px rgba(7,84,57,.09)}.target{display:grid;grid-template-columns:1fr auto;gap:10px;padding-bottom:15px;border-bottom:1px solid #e6eee9}.target strong{display:block;font-size:19px}.target small{display:block;margin-top:4px;color:var(--muted);font-size:13px}.qty{color:var(--green);font-size:20px;font-weight:850}.item-list{display:grid;margin-top:12px;border:1px solid #e2ece7;border-radius:14px;overflow:hidden}.item-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;padding:12px;background:#fff}.item-row+.item-row{border-top:1px solid #e8efeb}.item-copy{min-width:0}.item-copy strong,.item-copy small{display:block}.item-copy strong{font-size:14px;overflow-wrap:anywhere}.item-copy small{margin-top:3px;color:var(--muted);font-size:11px;overflow-wrap:anywhere}.item-qty{align-self:center;color:var(--green);font-size:15px;font-weight:850;white-space:nowrap}.photo-guide{margin-top:14px;padding:12px 13px;border:1px solid #f0cd7e;border-radius:12px;color:#754d00;background:#fff8e8;font-size:13px;font-weight:750}.capture,.submit{width:100%;min-height:50px;border:0;border-radius:12px;font:inherit;font-weight:800}.capture{margin-top:14px;color:var(--green);border:1px solid #9bcab5;background:#fff}.capture.secondary{margin-top:10px;color:var(--muted);border-color:var(--line)}.submit{margin-top:12px;color:#fff;background:var(--green)}button:disabled{opacity:.45}.preview{display:none;overflow:hidden;margin-top:12px;border:1px solid var(--line);border-radius:15px;background:#edf5f1}.preview.show{display:block}.preview img{display:block;width:100%;max-height:420px;object-fit:cover}.preview span{display:block;padding:9px 11px;color:var(--muted);font-size:12px}.status{display:none;margin-top:12px;padding:12px;border-radius:12px;font-weight:700;text-align:center}.status.show{display:block}.status.loading{color:#7a4a00;background:#fff1d6}.status.success{color:#086c49;background:#dff7eb}.status.error{color:var(--red);background:#ffebe9}.hint{margin-bottom:0;font-size:12px}input[type=file]{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
  </style>
</head>
 <body><main><div class="badge">DBY · CHỤP QUA ĐIỆN THOẠI</div><h1>Ảnh đóng gói sẵn hôm nay</h1><p>Kiểm tra danh sách và chụp ảnh thực tế cho từng nhân viên.</p><div class="card"><div class="target"><div><strong id="employee">Đang tải...</strong><small id="progress"></small></div><div id="qty" class="qty"></div></div><div id="items" class="item-list"></div><div class="photo-guide">Ảnh cần thể hiện rõ, đầy đủ và đúng số lượng đóng gói của các phân loại trong danh sách.</div><input id="cameraInput" type="file" accept="image/jpeg" capture="environment"><button id="takePhoto" class="capture" type="button" disabled>Chụp ảnh số lượng đóng gói</button><div id="preview" class="preview"><img id="image" alt="Ảnh đóng gói"><span id="name"></span></div><button id="submit" class="submit" type="button" disabled>Gửi ảnh nhân viên này</button><button id="nextTarget" class="capture secondary" type="button" hidden>Chuyển sang danh sách tiếp theo</button><div id="status" class="status"></div><p class="hint">Chỉ nhận ảnh JPG chụp bằng camera, tối đa 3 ảnh cho danh sách này.</p></div></main>
<script>
const session=new URLSearchParams(location.search).get('session')||'';
const cameraInput=document.querySelector('#cameraInput'),takePhoto=document.querySelector('#takePhoto'),submit=document.querySelector('#submit'),nextTarget=document.querySelector('#nextTarget'),preview=document.querySelector('#preview'),image=document.querySelector('#image'),nameBox=document.querySelector('#name'),statusBox=document.querySelector('#status');
let photoBlobs=[],previewUrl='',targets=[],targetIndex=0;
function status(kind,text){statusBox.className=`status show ${kind}`;statusBox.textContent=text}
async function compressImage(source){
  const bitmap=await createImageBitmap(source);let width=Math.min(bitmap.width,1920),height=Math.max(1,Math.round(bitmap.height*(width/bitmap.width)));const target=document.createElement('canvas'),context=target.getContext('2d');
  for(let attempt=0;width>=320&&height>=240;attempt+=1){target.width=width;target.height=height;context.drawImage(bitmap,0,0,width,height);for(const quality of [.84,.74,.64,.54,.44,.34,.25]){const blob=await new Promise(resolve=>target.toBlob(resolve,'image/jpeg',quality));if(blob&&blob.size<=480*1024){bitmap.close();return blob}}width=Math.round(width*.75);height=Math.round(height*.75)}bitmap.close();throw new Error('Không thể nén ảnh xuống dưới 500 KB. Hãy chụp lại ảnh rõ hơn.')
}
async function sha256(blob){const bytes=await blob.arrayBuffer();const digest=await crypto.subtle.digest('SHA-256',bytes);return Array.from(new Uint8Array(digest),byte=>byte.toString(16).padStart(2,'0')).join('')}
function renderTarget(){const target=targets[targetIndex];if(!target)return;document.querySelector('#employee').textContent=(target.employeeNames||[target.employee]).join(', ')||'Nhân viên';document.querySelector('#progress').textContent=`Danh sách ${targetIndex+1}/${targets.length} · ${target.productName||target.productSku}`;document.querySelector('#qty').textContent=`${target.requestedQty} ${target.unit}`;const list=document.querySelector('#items');list.replaceChildren();(target.items||[]).forEach(item=>{const row=document.createElement('div');row.className='item-row';const copy=document.createElement('div');copy.className='item-copy';const title=document.createElement('strong');title.textContent=item.name||item.sku;const meta=document.createElement('small');meta.textContent=[item.sku,item.composition].filter(Boolean).join(' · ');copy.append(title,meta);const qty=document.createElement('span');qty.className='item-qty';qty.textContent=`${item.requestedQty} ${item.unit}`;row.append(copy,qty);list.append(row)});photoBlobs=[];preview.classList.remove('show');submit.disabled=true;submit.textContent='Gửi ảnh nhân viên này';nextTarget.hidden=true;takePhoto.disabled=false;}
takePhoto.onclick=()=>cameraInput.click();
cameraInput.onchange=async()=>{const file=cameraInput.files?.[0];cameraInput.value='';if(!file)return;if(file.type!=='image/jpeg'){status('error','Chỉ nhận ảnh JPG/JPEG chụp trực tiếp từ camera.');return}if(photoBlobs.length>=3){status('error','Mỗi sản phẩm tối đa 3 ảnh.');return}try{takePhoto.disabled=true;const photoBlob=await compressImage(file);photoBlobs.push(photoBlob);if(previewUrl)URL.revokeObjectURL(previewUrl);previewUrl=URL.createObjectURL(photoBlob);image.src=previewUrl;nameBox.textContent=`Đã chụp ${photoBlobs.length}/3 ảnh cho sản phẩm này`;preview.classList.add('show');submit.disabled=false;statusBox.className='status'}catch(error){status('error',error?.message||'Không thể xử lý ảnh.')}finally{takePhoto.disabled=photoBlobs.length>=3}};
submit.onclick=async()=>{if(!photoBlobs.length||!targets[targetIndex])return;submit.disabled=true;takePhoto.disabled=true;status('loading',`Đang lưu ${photoBlobs.length} ảnh SKU ${targetIndex+1}/${targets.length}...`);try{const filesToSend=[...photoBlobs];for(let index=0;index<filesToSend.length;index+=1){const photoBlob=filesToSend[index];const hash=await sha256(photoBlob);let response;try{response=await fetch(`/prepack-evidence/submit?session=${encodeURIComponent(session)}&batch=${encodeURIComponent(targets[targetIndex].id)}`,{method:'POST',headers:{'content-type':'image/jpeg','x-camera-capture':'camera-input','x-content-sha256':hash,'x-file-name':`anh-${index+1}-dong-goi-hom-nay.jpg`},body:photoBlob})}catch(error){throw new Error('Phiên QR đã mất kết nối. Hãy quét mã QR mới trên máy tính.')}const result=await response.json().catch(()=>({}));if(!response.ok||!result.success)throw new Error(result.error||`Phiên QR không còn hoạt động (HTTP ${response.status}). Hãy quét mã QR mới.`);photoBlobs.shift()}targets[targetIndex].completedToday=true;status('success',targetIndex+1<targets.length?'Đã lưu. Chuyển sang SKU tiếp theo.':'Đã hoàn tất toàn bộ SKU.');nextTarget.hidden=targetIndex+1>=targets.length;submit.textContent='Đã gửi'}catch(error){status('error',error?.message||'Không thể gửi ảnh.');takePhoto.disabled=false;submit.disabled=false}};
nextTarget.onclick=()=>{targetIndex+=1;renderTarget();statusBox.className='status';};
 fetch(`/prepack-evidence/session?session=${encodeURIComponent(session)}`).then(async response=>{const result=await response.json().catch(()=>({}));if(!response.ok||!result.success)throw new Error(result.error||'Phiên QR không hợp lệ.');targets=result.targets||[];targetIndex=Math.max(0,targets.findIndex(item=>!item.completedToday));if(targetIndex<0)targetIndex=0;document.querySelector('#employee').textContent=result.employee||'Nhân viên';renderTarget();}).catch(error=>{status('error',error?.message||'Không thể mở phiên QR.');takePhoto.disabled=true});
 addEventListener('pagehide',()=>{if(previewUrl)URL.revokeObjectURL(previewUrl)});
 </script></body></html>
