<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notification Design QA Comparison</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; color: #13203d; background: #e9eef4; font: 600 13px/1.4 "Segoe UI", sans-serif; }
    header { height: 52px; display: flex; align-items: center; padding: 0 20px; background: #fff; border-bottom: 1px solid #cfd8e5; }
    main { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; padding: 14px; }
    section { min-width: 0; overflow: hidden; background: #fff; border: 1px solid #cfd8e5; border-radius: 10px; box-shadow: 0 8px 24px rgba(22, 38, 69, .08); }
    h2 { height: 38px; margin: 0; display: flex; align-items: center; padding: 0 12px; border-bottom: 1px solid #dde4ed; font-size: 13px; }
    .viewport { position: relative; width: 100%; aspect-ratio: 3 / 2; overflow: hidden; background: #fff; }
    img { width: 100%; height: 100%; display: block; object-fit: contain; }
    iframe { position: absolute; inset: 0; width: 1536px; height: 1024px; border: 0; transform-origin: 0 0; }
  </style>
</head>
<body>
  <header>Đối chiếu phương án 3 — mockup và bản triển khai cùng viewport 1536 × 1024</header>
  <main>
    <section>
      <h2>Mockup đã chốt</h2>
      <div class="viewport"><img src="./notification-bell-fullscreen-target.png" alt="Mockup trung tâm thông báo" /></div>
    </section>
    <section>
      <h2>Bản triển khai</h2>
      <div class="viewport"><iframe src="/?notificationUiTest=1" title="Bản triển khai trung tâm thông báo"></iframe></div>
    </section>
  </main>
  <script>
    const resizeImplementation = () => {
      const viewport = document.querySelector('iframe').parentElement;
      document.querySelector('iframe').style.transform = `scale(${viewport.clientWidth / 1536})`;
    };
    new ResizeObserver(resizeImplementation).observe(document.querySelector('iframe').parentElement);
    resizeImplementation();
  </script>
</body>
</html>
