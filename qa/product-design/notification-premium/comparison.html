<!doctype html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Notification Premium Design QA</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; padding: 18px; color: #0f172a; background: #e9eef2; font-family: "Segoe UI", sans-serif; }
        h1 { margin: 0 0 14px; font-size: 18px; }
        .comparison { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        figure { margin: 0; overflow: hidden; background: white; border: 1px solid #cbd5e1; border-radius: 12px; }
        figcaption { padding: 9px 12px; border-bottom: 1px solid #e2e8f0; font-size: 12px; font-weight: 700; }
        .frame { position: relative; width: 100%; aspect-ratio: 3 / 2; overflow: hidden; background: #fff; }
        img { width: 100%; height: 100%; display: block; object-fit: contain; }
        iframe { width: 1536px; height: 1024px; border: 0; transform-origin: top left; }
    </style>
</head>
<body>
    <h1>Design QA · Cùng viewport 1536 × 1024 · Trạng thái danh sách mặc định</h1>
    <div class="comparison">
        <figure>
            <figcaption>Nguồn chuẩn · Operational Command Center</figcaption>
            <div class="frame"><img src="./premium-command-center.png" alt="Nguồn thiết kế Operational Command Center" /></div>
        </figure>
        <figure>
            <figcaption>Implementation hiện tại</figcaption>
            <div class="frame"><iframe src="/?notificationUiTest=1" title="Implementation"></iframe></div>
        </figure>
    </div>
    <script>
        const implementationFrame = document.querySelector('iframe');
        const implementationViewport = implementationFrame.parentElement;
        const fitImplementation = () => {
            implementationFrame.style.transform = `scale(${implementationViewport.clientWidth / 1536})`;
        };
        new ResizeObserver(fitImplementation).observe(implementationViewport);
        fitImplementation();
    </script>
</body>
</html>
